  <div class="modal-overlay" id="lead-modal">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="lead-modal-title">
      <button type="button" class="modal-close" onclick="closeLeadModal()" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <p class="eyebrow" style="color:var(--cyan-500); margin-bottom:10px;">Talk to our team</p>
      <h3 class="modal-title" id="lead-modal-title">Let's find the right fit</h3>
      <p class="modal-sub">Tell us a little about what you need and someone from our team will follow up within one business day.</p>

      <form id="lead-form" novalidate>
        <input type="hidden" id="lead-source" data-label="Clicked from">
        <div class="field-row">
          <div class="field"><label>Your name <span class="req">*</span></label><input type="text" placeholder="Full name" required></div>
          <div class="field"><label>Work email <span class="req">*</span></label><input type="email" placeholder="Email address" required></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Company <span class="req">*</span></label><input type="text" placeholder="Company name" required></div>
          <div class="field"><label>Phone <span style="color:var(--cream-on-navy-dim); font-weight:400;">(optional)</span></label><input type="tel" placeholder="Phone number"></div>
        </div>
        <div class="field-row" style="grid-template-columns:1fr;">
          <div class="field"><label>How can we help? <span style="color:var(--cream-on-navy-dim); font-weight:400;">(optional)</span></label><textarea placeholder="A quick note on what you're looking for"></textarea></div>
        </div>
        <div class="consent-row"><input type="checkbox" id="lead-consent" data-label="Consent: contact" required><label for="lead-consent">I agree to be contacted by ExpertiseInPharma about this enquiry.</label></div>
        <button type="submit" class="btn-primary" style="width:100%; justify-content:center; margin-top:8px;">Send message
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8H13M13 8L9 4M13 8L9 12" stroke="var(--navy-950)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>
      <div class="form-success" id="lead-form-success">
        <svg class="form-success-check" width="56" height="56" viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="28" stroke="var(--cyan-500)" stroke-width="2.2"/><path d="M20 33l8 8 16-17" stroke="var(--cyan-500)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <h3 style="font:500 22px/1.3 var(--font-display); color:var(--cream-on-navy); margin:12px 0 10px;">Message sent</h3>
        <p style="font:400 15px/1.6 var(--font-body); color:var(--cream-on-navy-dim);">Thanks &mdash; we'll be in touch within one business day.</p>
      </div>
    </div>
  </div>
